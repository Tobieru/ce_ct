<script>
const fr = (n, d) => `$\\frac{${n}}{${d}}$`;

const questions = [
  { id: '2026-v1-a1', cat: 'Дроби (ЦЭ/ЦТ 2026)', sk: 'fraction-to-natural-gt1', src: 'ЦЭ/ЦТ 2026, вариант 1, A1', tp: 'single', qt: 'Укажите дробь, которую можно представить в виде натурального числа, большего 1.', op: [fr(24,16), fr(13,7), fr(5,5), fr(6,36), fr(15,3)], ci: 4, sol: '$\\frac{15}{3}=5$ — натуральное больше 1; $\\frac{5}{5}=1$, остальные нет.' },
  { id: '2026-v1-a2', cat: 'Треугольники (ЦЭ/ЦТ 2026)', sk: 'triangle-true-statement', src: 'ЦЭ/ЦТ 2026, вариант 1, A2', tp: 'single', qt: 'Укажите номер верного утверждения.', op: ['Медиана равнобедренного треугольника, проведенная к его основанию, равна длине его боковой стороны;', 'Если периметр треугольника равен 24 и известно, что длины двух его сторон равны 7 и 8, то этот треугольник является равнобедренным;', 'Если периметр равнобедренного треугольника равен 26, а основание равно 10, то длина его боковой стороны равна 8;', 'Если периметр равностороннего треугольника равен 36, то длина его стороны равна 9;', 'Если гипотенуза прямоугольного треугольника равна 36, то медиана, проведенная к гипотенузе, равна 12.'], ci: 2, sol: '$(26-10)/2=8$ — верно 3; третья сторона 24−7−8=9 (не равнобедренный), сторона равностороннего 36/3=12, медиана к гипотенузе 36/2=18.' },
  { id: '2026-v1-a3', cat: 'Неравенства (ЦЭ/ЦТ 2026)', sk: 'rational-inequality-x2-over-a-x', src: 'ЦЭ/ЦТ 2026, вариант 1, A3', tp: 'single', qt: 'Среди чисел $15; 14; -14; -15; 0$ укажите то, которое является решением неравенства $\\frac{x^2}{14-x}<0$.', op: ['15', '14', '-14', '-15', '0'], ci: 0, sol: 'Нужно $x\\ne0$ и $14-x<0$, то есть $x>14$: подходит 15.' },
  { id: '2026-v1-a4', cat: 'Логарифмы (ЦЭ/ЦТ 2026)', sk: 'log-sum-product-same-base', src: 'ЦЭ/ЦТ 2026, вариант 1, A4', tp: 'single', qt: 'Укажите верное равенство.', op: ['$\\log_2 5\\cdot\\log_2 7=\\log_2 35$', '$\\log_2 5+\\log_2 7=\\log_2 5\\cdot\\log_2 7$', '$\\log_2 5+\\log_2 7=\\log_2 12$', '$\\log_2 5+\\log_2 7=\\log_2 35$', '$\\log_2 5+\\log_2 7=\\log_4 35$'], ci: 3, sol: '$\\log_a b+\\log_a c=\\log_a(bc)$: верно $\\log_2 5+\\log_2 7=\\log_2 35$.' },
  { id: '2026-v1-a5', cat: 'Линейная функция (ЦЭ/ЦТ 2026)', sk: 'linear-parallel-slope', src: 'ЦЭ/ЦТ 2026, вариант 1, A5', tp: 'single', qt: 'Укажите функцию, график которой параллелен графику функции $y=2x-3$.', op: ['$y=-2x+3$', '$y=3x+2$', '$y=2x+3$', '$y=3x-2$', '$y=-2x-3$'], ci: 2, sol: 'Параллельность при равных $k=2$: $y=2x+3$.' },
  { id: '2026-v1-a6', cat: 'Промежутки (ЦЭ/ЦТ 2026)', sk: 'intervals-true-statements', src: 'ЦЭ/ЦТ 2026, вариант 1, A6', tp: 'multi', qt: 'Укажите номера верных утверждений.', op: ['Число -4,27 принадлежит промежутку $(-5; -2]$;', 'Промежутку $(2; 5]$ принадлежат ровно четыре целых числа;', 'Объединением промежутков $(-8; 5]$ и $[-5; 8)$ является промежуток $[-5; 5]$;', 'Пересечением промежутков $(-\\infty; 5]$ и $(2; +\\infty)$ является промежуток $(2; 5]$;', 'Промежуток $[-5; 5)$ может являться областью определения четной функции.'], cc: [0, 3], sol: 'Верны 1 и 4: целых в $(2;5]$ три (3,4,5); объединение $(-8;8)$; $[-5;5)$ несимметричен.' },
  { id: '2026-v1-a10', cat: 'Четность функций (ЦЭ/ЦТ 2026)', sk: 'function-parity-neither', src: 'ЦЭ/ЦТ 2026, вариант 1, A10', tp: 'multi', qt: 'Укажите номера функций, которые не являются ни четными, ни нечетными.', op: ['$f(x)=\\tan 11x$', '$f(x)=|11x|$', '$f(x)=\\frac{x^5+4}{x-1}$', '$f(x)=6x^2+5x$', '$f(x)=\\sqrt{x+11}$'], cc: [2, 3, 4], sol: '$\\tan 11x$ нечетная, $|11x|$ четная; остальные ни четные ни нечетные: 3, 4, 5.' },
  { id: '2026-v1-b3', cat: 'НОД наборов (ЦЭ/ЦТ 2026)', sk: 'gcd-candy-sets', src: 'ЦЭ/ЦТ 2026, вариант 1, B3', tp: 'input', qt: 'Какое наибольшее число одинаковых наборов конфет можно составить из 585 шоколадных, 405 трюфельных, 360 молочных конфет?', op: [], ca: '45', sol: '$585=45\\cdot13$, $405=45\\cdot9$, $360=45\\cdot8$, НОД$(13,9,8)=1$ → 45.' },

};

function getTopicLabel(category, skillId = null) {
  if (skillId && SKILL_TOPICS[skillId]) return SKILL_TOPICS[skillId];
  const raw = String(category || '').replace(/\s*\(ЦЭ\/ЦТ\s+\d{4}\)$/i, '').trim();
  if (/обратные тригонометрические|^тригонометрия/i.test(raw)) return 'Тригонометрия';
  if (/логарифм/i.test(raw)) return 'Логарифмы';
  if (/неравенств/i.test(raw)) return 'Неравенства';
  if (/линейная функция|ч[её]тност[ьи] функций/i.test(raw)) return 'Функции';
  if (/делимость|НОД наборов|суммы кратных/i.test(raw)) return 'Делимость и числа';
  return raw || 'Другие темы';
}

function getTopicForQuestion(question) {
  return getTopicLabel(question && question.category, question && question.skillId);
}

function formatQuestionText(text) {
  return String(text || '').replace(/\$([^$]+)\$/g, (_, formula) =>
    '<span class="question-math-nowrap">$' + formula + '$</span>'
  );
}

function getSkillLabel(skillId) {
  return SKILL_LABELS[skillId] || String(skillId || 'Общий навык').replace(/[-_]+/g, ' ');
}

function getDetailedSolutionHtml(q) {
  const id = q && q.skillId;
  let rule = '';

  if (id === 'log-sum-product-same-base') {
    rule = `<p>По свойству логарифмов: <strong>сумма логарифмов с одинаковым основанием равна логарифму произведения аргументов.</strong></p>
      <div class="rounded-lg bg-white/80 border border-slate-200 p-3 text-center">$\\log_a b+\\log_a c=\\log_a(bc),\\quad a>0,\\ a\\ne1,\\ b,c>0.$</div>
      <p>Вычисляем произведение аргументов и оставляем прежнее основание логарифма.</p>`;
  } else if (id === 'log-equation-product-times') {
    rule = `<p>Сначала упрощаем разность логарифмов по свойству:</p>
      <div class="rounded-lg bg-white/80 border border-slate-200 p-3 text-center">$\\log_a u-\\log_a v=\\log_a\\frac{u}{v}.$</div>
      <p>Затем удобно сделать замену $t=\\log_a x$ и решить полученное квадратное уравнение. В конце возвращаемся к $x$ и проверяем область допустимых значений.</p>`;
  } else if (id === 'linear-parallel-slope') {
    rule = `<p>Для прямой $y=kx+b$ число $k$ — угловой коэффициент. <strong>Разные прямые параллельны, если их угловые коэффициенты равны, а свободные члены различаются.</strong></p>
      <div class="rounded-lg bg-white/80 border border-slate-200 p-3 text-center">$k_1=k_2,\\qquad b_1\\ne b_2.$</div>
      <p>Значит, сравниваем только коэффициенты при $x$; свободный член может быть другим.</p>`;
  } else if (id === 'trig-zero-argument') {
    const isSine = String(q.questionText || '').includes('\\sin');
    rule = isSine
      ? `<p>На единичной окружности $\\cos x$ — координата точки по горизонтали (ось $x$), а $\\sin x$ — координата по вертикали (ось $y$).</p>
        <p>Синус равен нулю, когда точка лежит на горизонтальной оси: её вертикальная координата равна нулю.</p>
        <div class="rounded-lg bg-white/80 border border-slate-200 p-3 text-center">$\\sin x=0\\iff x=\\pi k,\\quad k\\in\\mathbb Z.$</div>
        <p>Например, при $x=-\\pi$ точка окружности находится в положении $(-1,0)$: поэтому $\\sin(-\\pi)=0$, а $\\cos(-\\pi)=-1$.</p>`
      : `<p>На единичной окружности $\\cos x$ — горизонтальная координата точки, а $\\sin x$ — вертикальная. Косинус равен нулю, когда горизонтальная координата равна нулю, то есть точка находится на вертикальной оси.</p>
        <div class="rounded-lg bg-white/80 border border-slate-200 p-3 text-center">$\\cos x=0\\iff x=\\frac{\\pi}{2}+\\pi k,\\quad k\\in\\mathbb Z.$</div>
        <p>Поэтому значения вида $-\\frac{\\pi}{2}$ и $-\\frac{3\\pi}{2}$ дают нулевой косинус, а $\\cos(-\\pi)=-1$.</p>`;
  } else if (id === 'arcsin-expression-value') {
    rule = `<p>Функция $\\arcsin t$ возвращает угол в пределах $[-\\frac{\\pi}{2};\\frac{\\pi}{2}]$, синус которого равен $t$.</p>
      <div class="rounded-lg bg-white/80 border border-slate-200 p-3 space-y-1">
        <p>$\\arcsin(-1)=-\\frac{\\pi}{2}$</p>
        <p>$\\arcsin(-\\frac12)=-\\frac{\\pi}{6}$</p>
        <p>$\\arcsin(-\\frac{\\sqrt2}{2})=-\\frac{\\pi}{4}$</p>
        <p>$\\arcsin(-\\frac{\\sqrt3}{2})=-\\frac{\\pi}{3}.$</p>
      </div>
      <p>Подставляем табличное значение в исходное выражение и упрощаем.</p>`;
  } else if (id === 'function-parity-neither') {
    rule = `<p>Проверяем чётность и нечётность по определениям. Сначала область определения должна быть симметрична относительно нуля.</p>
      <div class="rounded-lg bg-white/80 border border-slate-200 p-3 space-y-1">
        <p>Чётная: $f(-x)=f(x).$</p>
        <p>Нечётная: $f(-x)=-f(x).$</p>
      </div>
      <p>Если ни одно равенство не выполняется (или область определения несимметрична), функция не является ни чётной, ни нечётной.</p>`;
  } else if (id === 'triangle-true-statement') {
    rule = `<p>Полезные быстрые факты для таких утверждений:</p>
      <div class="rounded-lg bg-white/80 border border-slate-200 p-3 space-y-1">
        <p>Равносторонний треугольник: $a=\\frac{P}{3}.$</p>
        <p>Равнобедренный треугольник с основанием $b$: $a=\\frac{P-b}{2}.$</p>
        <p>Медиана, проведённая к гипотенузе прямоугольного треугольника, равна половине гипотенузы: $m=\\frac{c}{2}.$</p>
      </div>
      <p>Подставляем числа из каждого утверждения и проверяем, какое из них выполняется.</p>`;
  } else if (id === 'gcd-candy-sets') {
    rule = `<p>Чтобы разделить несколько видов конфет на максимально возможное число одинаковых наборов без остатка, нужно найти <strong>наибольший общий делитель (НОД)</strong> всех количеств.</p>
      <div class="rounded-lg bg-white/80 border border-slate-200 p-3 text-center">$N=\\operatorname{НОД}(a,b,c).$</div>
      <p>Каждое количество конфет делится на $N$ без остатка, а увеличить число наборов нельзя.</p>`;
  } else if (id === 'division-remainder-formula') {
    rule = `<p>При делении с остатком действует одно правило:</p>
      <div class="rounded-lg bg-white/80 border border-slate-200 p-3 text-center">$\\text{делимое}=\\text{делитель}\\cdot\\text{неполное частное}+\\text{остаток}.$</div>
      <p>Подставляем известные делитель, частное и остаток в эту формулу.</p>`;
  } else if (id === 'quadratic-product-of-roots') {
    rule = `<p>По теореме Виета для $x^2+px+q=0$ сумма корней равна $-p$, а произведение корней равно свободному члену $q$.</p>
      <div class="rounded-lg bg-white/80 border border-slate-200 p-3 text-center">$x_1x_2=q.$</div>
      <p>Ищем уравнение с нужным свободным членом и проверяем, что у него есть действительные корни.</p>`;
  } else if (id === 'expression-sense-at-negative') {
    rule = `<p>Для выражений с корнями проверяем знак подкоренного выражения:</p>
      <div class="rounded-lg bg-white/80 border border-slate-200 p-3 space-y-1">
        <p>Под чётным корнем: $A\\ge0.$</p>
        <p>Нечётный корень определён при любом действительном $A$.</p>
        <p>Если корень стоит в знаменателе, он дополнительно не должен быть равен нулю.</p>
      </div>`;
  } else if (id === 'rational-inequality-x2-over-a-x') {
    rule = `<p>Квадрат числа неотрицателен: $x^2\\ge0$, а дробь отрицательна, когда числитель положителен и знаменатель отрицателен. Случай $x=0$ отдельно исключается, потому что тогда дробь равна нулю.</p>`;
  } else if (id === 'exponential-inequality-smallest-integer') {
    rule = `<p>В показательных неравенствах удобно привести степени к одинаковому основанию. При основании больше единицы знак неравенства сохраняется при сравнении показателей.</p>`;
  } else if (id === 'intervals-true-statements') {
    rule = `<p>Для промежутков аккуратно проверяй скобки: круглая скобка означает, что граница не входит, квадратная — что входит. Для проверки целых чисел всегда выписывай допустимые целые значения, а не только длину промежутка.</p>`;
  } else if (id === 'sum-multiples-in-interval') {
    rule = `<p>Сначала перечисляем все кратные числа, которые строго больше нижней и строго меньше верхней границы. Если они образуют арифметическую прогрессию, можно сложить их по формуле $S_n=\\frac{(a_1+a_n)n}{2}.$</p>`;
  }

  if (!rule) return q && q.solution ? q.solution : '';
  return `<div class="space-y-3">
    <section class="rounded-xl border border-indigo-100 bg-indigo-50/70 p-3 space-y-2">
      <p class="text-[11px] font-bold uppercase tracking-wider text-indigo-800">Ключевое правило</p>
      <div class="text-sm leading-7 text-slate-800">${rule}</div>
    </section>
    <section class="space-y-1">
      <p class="text-[11px] font-bold uppercase tracking-wider text-slate-500">Применяем к заданию</p>
      <div class="text-sm leading-7">${q.solution || 'Подставь данные из условия в правило выше и проверь ответ.'}</div>
    </section>
  </div>`;
}

function getAnswerSolutionHtml(q) {
  let html = String(getDetailedSolutionHtml(q) || (q && q.solution) || '');
  html = html
    .replace(/<p[^>]*>\s*Ключевое правило\s*<\/p>/gi, '')
    .replace(/<p[^>]*>\s*Применяем к заданию\s*<\/p>/gi, '')
    .replace(/\sclass="[^"]*"/g, '')
    .replace(/<section\b/gi, '<div')
    .replace(/<\/section>/gi, '</div>');
  return html;
}

function safeParseArray(raw) {
  try {
    const p = JSON.parse(raw);
    return Array.isArray(p) ? p : [];
  } catch (e) {
    return [];
  }
}

function normalizeHistoryPool(inp) {
  if (!Array.isArray(inp)) return [];
  return inp
    .map(g => Array.isArray(g) ? g.map(String).filter(id => questions.some(q => String(q.id) === id)) : [])
    .filter(g => g.length)
    .slice(-3);
}

function normalizeErrorIds(inp) {
  if (!Array.isArray(inp)) return [];
  return [...new Set(inp.map(String).filter(id => questions.some(q => String(q.id) === id)))];
}

function getHistoryPool() { return normalizeHistoryPool(safeParseArray(localStorage.getItem('exam_history_pool'))); }
function saveHistoryPool(p) { localStorage.setItem('exam_history_pool', JSON.stringify(normalizeHistoryPool(p))); }
function getErrors() { return normalizeErrorIds(safeParseArray(localStorage.getItem('exam_errors'))); }
function saveErrors(e) { localStorage.setItem('exam_errors', JSON.stringify(normalizeErrorIds(e))); }

function shuffleArray(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
}

function escapeHtml(v) {
  return String(v).replace(/[&<>"']/g, s => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[s]));
}

const randInt = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const pick = a => a[Math.floor(Math.random() * a.length)];
const capitalize = s => s.charAt(0).toUpperCase() + s.slice(1);
const dec = x => String(x).replace('.', ',');
const fmtLinear = (k, b) => b === 0 ? `$y=${k}x$` : b > 0 ? `$y=${k}x+${b}$` : `$y=${k}x-${Math.abs(b)}$`;

function fmtInt(lo, lc, hi, hc) {
  const L = lo === null ? '-\\infty' : String(lo);
  const H = hi === null ? '+\\infty' : String(hi);
  return `$${lc ? '[' : '('}${L};\\, ${H}${hc ? ']' : ')'}$`;
}

function countIntegers(lo, lc, hi, hc) {
  const s = lc ? Math.ceil(lo) : Math.floor(lo) + 1;
  const e = hc ? Math.floor(hi) : Math.ceil(hi) - 1;
  return Math.max(0, e - s + 1);
}

const piMult = m => {
  const s = m < 0 ? '-' : '';
  const a = Math.abs(m);
  return a === 1 ? `$${s}\\pi$` : `$${s}${a}\\pi$`;
};

const piHalf = n => {
  const s = n < 0 ? '-' : '';
  const a = Math.abs(n);
  return a === 1 ? `$${s}\\frac{\\pi}{2}$` : `$${s}\\frac{${a}\\pi}{2}$`;
};

function makeIntervalStatement(kind, want) {
  if (kind === 0) {
    const lo = -randInt(4, 9), hi = randInt(2, 9);
    const lc = Math.random() < 0.5, hc = Math.random() < 0.5;
    let x = want ? lo + 0.27 + Math.random() * 0.5 : hi + 1 + Math.random() * 0.9;
    if (want && x >= hi) x = (lo + hi) / 2;
    const xv = Math.round(x * 100) / 100;
    return { text: `число ${dec(xv)} принадлежит промежутку ${fmtInt(lo, lc, hi, hc)}`, truth: want, reason: want ? 'число лежит внутри промежутка' : 'число вне промежутка' };
  }
  if (kind === 1) {
    let lo = -randInt(2, 9), hi = randInt(2, 9);
    const lc = Math.random() < 0.5, hc = Math.random() < 0.5;
    let n = countIntegers(lo, lc, hi, hc);
    if (n < 2) { lo = -5; hi = 5; n = countIntegers(lo, lc, hi, hc); }
    const claim = want ? n : n + pick([1, 2]);
    return { text: `промежутку ${fmtInt(lo, lc, hi, hc)} принадлежат ровно ${claim} целых числа`, truth: want, reason: `целых чисел ровно ${n}` };
  }
  if (kind === 2) {
    const a = -randInt(6, 9), b = randInt(2, 6), c = -randInt(1, 5), d = randInt(7, 9);
    const I1 = fmtInt(a, false, b, true), I2 = fmtInt(c, true, d, false);
    const un = fmtInt(a, false, d, false);
    const wr = pick([fmtInt(c, true, b, true), fmtInt(a, false, b, true), fmtInt(c, true, d, false)]);
    return { text: `объединением промежутков ${I1} и ${I2} является промежуток ${want ? un : wr}`, truth: want, reason: want ? 'объединение покрывает весь отрезок' : 'объединение другое' };
  }
  if (kind === 3) {
    const b = randInt(3, 8), a = randInt(1, b - 1);
    const I1 = fmtInt(null, false, b, true), I2 = fmtInt(a, false, null, false);
    const it = fmtInt(a, false, b, true);
    const wr = pick([fmtInt(a, true, b, true), fmtInt(a, false, b, false), fmtInt(a, true, b, false)]);
    return { text: `пересечением промежутков ${I1} и ${I2} является промежуток ${want ? it : wr}`, truth: want, reason: want ? 'общая часть именно такова' : 'общая часть другая' };
  }
  const a = randInt(3, 8);
  const par = pick(['четной', 'нечетной']);
  const I = want ? pick([fmtInt(-a, true, a, true), fmtInt(-a, false, a, false)]) : pick([fmtInt(-a, true, a, false), fmtInt(-a, false, a, true)]);
  return { text: `промежуток ${I} может являться областью определения ${par} функции`, truth: want, reason: want ? 'промежуток симметричен' : 'нужна симметричная область определения' };
}

function sourceLabel(q) {
  return q.year && q.variant && q.task
    ? `${q.exam || 'ЦЭ'} ${q.year} · Вариант ${q.variant} · ${q.task}`
    : (q.source || q.category || '');
}

function taskSortKey(t) {
  const m = /^([AB])(\d+)$/i.exec(t || '');
  if (!m) return 9999;
  return (m[1].toUpperCase() === 'A' ? 0 : 1000) + parseInt(m[2], 10);
}

function getTaskOrderList() {
  return [...new Set(questions.map(q => q.task).filter(Boolean))].sort((a, b) => taskSortKey(a) - taskSortKey(b));
}

function getReadyVariantGroups() {
  const map = new Map();
  questions.forEach(q => {
    if (!q.year || !q.variant) return;
    const k = `${q.year}|${q.exam}`;
    if (!map.has(k)) map.set(k, { year: q.year, exam: q.exam, variants: new Set() });
    map.get(k).variants.add(q.variant);
  });
  return [...map.values()]
    .map(g => ({ year: g.year, exam: g.exam, variants: [...g.variants].sort((a, b) => a - b) }))
    .sort((a, b) => b.year - a.year);
}

function getInfinitePracticePool() {
  return questions.filter(q => {
    // При выборе подтемы собираем все задания этого навыка, даже если они из разных лет/разделов.
    if (infinitePracticeSkillId) return q.skillId === infinitePracticeSkillId;
    if (infinitePracticeTopicLabel) return getTopicForQuestion(q) === infinitePracticeTopicLabel;
    return true;
  });
}

function getNextInfiniteQuestion() {
  const pool = getInfinitePracticePool();
  if (!pool.length) return null;

  let available = pool.filter(q => !infiniteSeenIds.has(String(q.id)));
  if (!available.length) {
    infiniteSeenIds = new Set();
    available = pool.filter(q => String(q.id) !== String(lastInfiniteQuestionId));
  }
  if (!available.length) available = pool;

  const next = pick(available);
  infiniteSeenIds.add(String(next.id));
  lastInfiniteQuestionId = String(next.id);
  return Object.assign({}, next);
}

function startInfinitePractice(skillId = null, topicLabel = null, displayLabel = '') {
  clearScratchpadData();
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  timerEnabled = false;
  timerInterval = null;

  infinitePracticeTitle = displayLabel || (skillId ? getSkillLabel(skillId) : topicLabel || 'Все темы и годы');
  infiniteAnsweredCount = 0;

}

function updateMarkPreview(v) {
  const el = document.getElementById('mark-preview');
  if (!el) return;
  const n = Number(v);
  if (v === '' || !Number.isFinite(n)) { el.textContent = '—'; return; }
  const s = Math.max(0, Math.min(100, Math.round(n)));
  const mark = testToMark(s);
  el.textContent = s === 0 ? '0 баллов → не аттестован' : `${s} балл(ов) → отметка ${mark}`;
}

// Рандомный тест: строго по порядку номеров, каждый номер — случайный год/вариант, без повторов номеров.
function buildRandomOrderedTest() {
  const order = getTaskOrderList();
  const recent = getHistoryPool().flat();
  const chosen = [];
  for (const task of order) {
    const pool = questions.filter(q => q.task === task);
    let cand = pool.filter(q => !recent.includes(String(q.id)));
    if (!cand.length) cand = pool;
    chosen.push(pick(cand));
  }
  return chosen;
}

function startNewTest() {
  clearScratchpadData();
  timerEnabled = isTimerOn;
  testDurationMinutes = selectedTimerMinutes;

  if (pendingTest && pendingTest.kind === 'ready') {
    const list = questions.filter(q => q.year === pendingTest.year && q.exam === pendingTest.exam && q.variant === pendingTest.variant);
    if (!list.length) { alert('Вопросы для этого варианта не найдены.'); return; }
    list.sort((a, b) => taskSortKey(a.task) - taskSortKey(b.task));
    currentTestQuestions = list;
    testKind = 'ready';
    currentTestLabel = `${pendingTest.exam} ${pendingTest.year}, вариант ${pendingTest.variant}`;
  } else {
    const chosen = buildRandomOrderedTest();
    if (!chosen.length) { alert('База вопросов пуста.'); return; }
    currentTestQuestions = chosen;
    const poolCopy = getHistoryPool();
    poolCopy.push(chosen.map(q => String(q.id)));
    saveHistoryPool(poolCopy);
    testKind = 'random';
    currentTestLabel = `Рандомный микс: ${chosen.length} заданий строго по порядку номеров`;
  }

  currentQuestionIndex = 0;
  score = 0;
  sessionMaxPoints = 0;
  testMode = 'normal';
  answeredCurrent = false;
  currentPracticeSession = null;
  lastPracticeClosed = 0;
  multiSelection = new Set();
  currentScreen = 'test-screen';
  if (timerEnabled) remainingSeconds = testDurationMinutes * 60;
  render();
  if (timerEnabled) startTimerInterval();
}

function startTimerInterval() {
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    remainingSeconds--;
    updateTimerUI();
    if (remainingSeconds <= 0) {
      clearInterval(timerInterval);
      timerInterval = null;
      alert('Время вышло!');
      clearScratchpadData();
      currentScreen = 'result-screen';
      render();
    }
  }, 1000);
}

function updateTimerUI() {
  const el = document.getElementById('timer-display');
  if (!el) return;
  const m = Math.floor(remainingSeconds / 60);
  const s = remainingSeconds % 60;
  el.innerText = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  if (remainingSeconds < 60) el.classList.add('text-rose-600', 'animate-pulse');
  else el.classList.remove('text-rose-600', 'animate-pulse');
}

function buildGeneratedQuestion(cfg) {
  const desired = cfg.desiredOptions || 5;
  const choices = [{ text: String(cfg.answer), correct: true }];
  const add = v => {
    const t = String(v);
    if (t && !choices.some(c => c.text === t)) choices.push({ text: t, correct: false });
  };
  (cfg.distractors || []).forEach(add);
  let step = 1;
  while (choices.length < desired) {
    const num = Number.parseFloat(String(cfg.answer));
    if (Number.isFinite(num)) add(String(num + step));
    else add(`Дополнительный вариант ${step}`);
    step++;
  }
  const sel = choices.slice(0, desired);
  shuffleArray(sel);
  return {
    id: `gen-${cfg.skillId}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`,
    category: cfg.category,
    skillId: cfg.skillId,
    sourceType: 'training-analog',
    type: 'single',
    maxPoints: 1,
    questionText: cfg.questionText,
    options: sel.map(c => c.text),
    correctIndex: sel.findIndex(c => c.correct),
    solution: cfg.solution,
    isGenerated: true,
    practiceOriginalId: cfg.sourceErrorId,
    isOriginal: false
  };
}

function generateVariantForSkill(skillId, original) {
  const near = v => [v + 1, v - 1, v + 2];

  if (skillId === 'fraction-to-natural-gt1') {
    const den = randInt(2, 9), val = randInt(2, 6), num = den * val;
    const ans = `$\\frac{${num}}{${den}}$`;
    const wr = new Set();
    const addW = (n, d) => {
      if (!d) return;
      const t = `$\\frac{${n}}{${d}}$`;
      if (!(n % d === 0 && n / d > 1) && t !== ans) wr.add(t);
    };
    while (wr.size < 4) {
      const k = randInt(0, 2);
      if (k === 0) { const d = randInt(2, 9); addW(d, d); }
      else if (k === 1) { const d = randInt(2, 9); addW(randInt(1, d - 1), d); }
      else { const d = randInt(2, 9); addW(randInt(2, 20), d); }
    }
    return buildGeneratedQuestion({
      category: original.category, skillId,
      questionText: 'Укажите дробь, которую можно представить в виде натурального числа, большего 1.',
      solution: `$\\frac{${num}}{${den}}=${val}$.`,
      answer: ans, distractors: [...wr], sourceErrorId: original.id
    });
  }

  if (skillId === 'rational-inequality-x2-over-a-x') {
    const a = randInt(5, 30), cor = a + randInt(1, 5);
    const ws = new Set();
    [a, -a, 0, a - randInt(1, 4), -a - randInt(1, 4)].forEach(v => { if (v !== cor && v <= a) ws.add(String(v)); });
    while (ws.size < 4) {
      const v = randInt(-a - 5, a);
      if (v !== cor && v <= a) ws.add(String(v));
    }
    return buildGeneratedQuestion({
      category: original.category, skillId,
      questionText: `Среди предложенных чисел укажите то, которое является решением неравенства $\\frac{x^2}{${a}-x}<0$.`,
      solution: `Дробь отрицательна при $x\\ne0$ и $x>${a}$; подходит ${cor}.`,
      answer: String(cor), distractors: [...ws].slice(0, 4), sourceErrorId: original.id
    });
  }

  if (skillId === 'log-sum-product-same-base') {
    const b = pick([2, 3, 4, 5]), m = b, n = pick([3, 4, 5, 6, 7]), mn = m * n;
    return buildGeneratedQuestion({
      category: original.category, skillId,
      questionText: 'Укажите верное равенство.',
      solution: '$\\log_a b+\\log_a c=\\log_a(bc)$.',
      answer: `$\\log_${b} ${m}+\\log_${b} ${n}=\\log_${b} ${mn}$`,
      distractors: [
        `$\\log_${b} ${m}\\cdot\\log_${b} ${n}=\\log_${b} ${mn}$`,
        `$\\log_${b} ${m}+\\log_${b} ${n}=\\log_${b} ${m + n}$`,
        `$\\log_${b} ${m}+\\log_${b} ${n}=\\log_${b} ${mn + b}$`,
        `$\\log_${b} ${m}+\\log_${b} ${n}=\\log_${b} ${mn + 2 * b}$`
      ],
      sourceErrorId: original.id
    });
  }

  if (skillId === 'linear-parallel-slope') {
    const k = pick([-7, -5, -3, 2, 3, 4, 6, 7]), b = randInt(-8, 8);
    let b2 = randInt(-8, 8);
    while (b2 === b) b2 = randInt(-8, 8);
    const ans = fmtLinear(k, b2);
    const ws = new Set();
    while (ws.size < 4) {
      const wk = pick([-8, -6, -4, -2, -1, 1, 5, 8, 9]);
      if (wk === k) continue;
      const t = fmtLinear(wk, randInt(-8, 8));
      if (t !== ans) ws.add(t);
    }
    return buildGeneratedQuestion({
      category: original.category, skillId,
      questionText: `Укажите функцию, график которой параллелен графику функции ${fmtLinear(k, b)}.`,
      solution: `Параллельность при равных $k=${k}$.`,
      answer: ans, distractors: [...ws], sourceErrorId: original.id
    });
  }

  if (skillId === 'triangle-true-statement') {
    const tr = [], fa = [];
    const b = pick([6, 8, 10, 12, 14]), side = pick([4, 5, 6, 7, 8, 9, 10, 11, 12]), P1 = b + 2 * side;
    tr.push(`если периметр равнобедренного треугольника равен ${P1}, а основание равно ${b}, то длина его боковой стороны равна ${side}`);
    fa.push(`если периметр равнобедренного треугольника равен ${P1}, а основание равно ${b}, то длина его боковой стороны равна ${side + pick([1, 2])}`);
    const s = pick([4, 6, 8, 9, 12, 16]), P2 = 3 * s;
    tr.push(`если периметр равностороннего треугольника равен ${P2}, то длина его стороны равна ${s}`);
    fa.push(`если периметр равностороннего треугольника равен ${P2}, то длина его стороны равна ${s + pick([1, 3])}`);
    const c = pick([12, 24, 36, 48, 60]);
    tr.push(`если гипотенуза прямоугольного треугольника равна ${c}, то медиана, проведенная к гипотенузе, равна ${c / 2}`);
    fa.push(`если гипотенуза прямоугольного треугольника равна ${c}, то медиана, проведенная к гипотенузе, равна ${c / 2 + pick([2, 4, 6])}`);
    const a = pick([5, 6, 7, 8, 9]);
    let b2 = pick([4, 5, 6, 7, 8]);
    if (b2 === a) b2 += 1;
    tr.push(`если периметр треугольника равен ${2 * a + b2} и известно, что длины двух его сторон равны ${a} и ${b2}, то этот треугольник является равнобедренным`);
    const c3 = pick([10, 11, 12, 13]);
    if (c3 !== a && c3 !== b2) fa.push(`если периметр треугольника равен ${a + b2 + c3} и известно, что длины двух его сторон равны ${a} и ${b2}, то этот треугольник является равнобедренным`);
    fa.push('медиана равнобедренного треугольника, проведенная к его основанию, равна длине его боковой стороны');
    fa.push('биссектриса равнобедренного треугольника, проведенная к его основанию, равна длине его боковой стороны');
    shuffleArray(tr);
    shuffleArray(fa);
    const tTxt = capitalize(tr[0]) + '.';
    const wr = [...new Set(fa)].slice(0, 4).map(t => capitalize(t) + '.');
    return buildGeneratedQuestion({
      category: original.category, skillId,
      questionText: 'Укажите номер верного утверждения.',
      solution: `Верно только: ${tTxt}`,
      answer: tTxt, distractors: wr, sourceErrorId: original.id
    });
  }

  if (skillId === 'intervals-true-statements') {
    const kinds = [0, 1, 2, 3, 4];
    shuffleArray(kinds);
    const slots = [0, 1, 2, 3, 4];
    shuffleArray(slots);
    const ts = new Set(slots.slice(0, 2));
    const st = [];
    for (let i = 0; i < 5; i++) st.push(makeIntervalStatement(kinds[i], ts.has(i)));
    const ci = [];
    st.forEach((s, i) => { if (s.truth) ci.push(i); });
    return {
      id: `gen-${skillId}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`,
      category: original.category, skillId, sourceType: 'training-analog',
      type: 'multi', maxPoints: 1,
      questionText: 'Укажите номера верных утверждений.',
      options: st.map(s => capitalize(s.text) + '.'),
      correctIndices: ci,
      solution: `Верные: ${ci.map(i => i + 1).join(', ')}. ` + st.map((s, i) => `${i + 1}) ${s.reason};`).join(' '),
      isGenerated: true, practiceOriginalId: original.id, isOriginal: false
    };
  }

  if (skillId === 'function-parity-neither') {
    const k1 = randInt(2, 12), k2 = randInt(2, 12), a = randInt(2, 15), c = randInt(1, 9);
    const n = pick([3, 5, 7]), b = randInt(2, 9), p = randInt(2, 9), q = randInt(1, 9);
    const ev = pick([`$f(x)=|${k2}x|$`, `$f(x)=${k2}x^2$`, `$f(x)=\\cos ${k2}x$`]);
    const od = pick([`$f(x)=\\tan ${k1}x$`, `$f(x)=${k1}x^3$`, `$f(x)=\\sin ${k1}x$`]);
    const items = [
      { text: ev, correct: false },
      { text: od, correct: false },

  if (skillId === 'gcd-candy-sets') {

      id: `gen-${skillId}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`,

  if (skillId === 'division-remainder-formula') {

      solution: 'Делимое = делитель·частное + остаток.',

      distractors: [`$${N}=${d}(${K}+${r})$`, `$${N}=${K}+${d + r}$`, `$${N}=${r}${K}+${d}$`, `$${N}=${r}(${K}+${d})$`],
      sourceErrorId: original.id
    });
  }

  if (skillId === 'quadratic-product-of-roots') {
    const P = randInt(5, 12);
    return buildGeneratedQuestion({
      category: original.category, skillId,
      questionText: `Укажите номер квадратного уравнения, произведение действительных корней которого равно ${P}.`,

      answer: `$x^2-${P + 1}x+${P}=0$`,
      distractors: [`$x^2-${P + 2}x+${P + 1}=0$`, `$x^2-${P}=0$`, `$x^2+${P}x=0$`, `$x^2-${2 * P}x+${P * P}=0$`],
      sourceErrorId: original.id
    });
  }

  if (skillId === 'purchase-change-kopecks') {
    const al = pick([110, 120, 130, 140, 150]), pc = randInt(4, 9), pk = pick([15, 17, 20, 23, 24, 25]);
    const spent = 3 * al + pc * pk;
    const had = (Math.floor(spent / 100) + 1) * 100;
    const ch = had - spent;
    return buildGeneratedQuestion({
      category: original.category, skillId,
      questionText: `Толя купил 3 альбома и ${pc} карандашей. Стоимость одного альбома равна ${Math.floor(al / 100)} р. ${al % 100} к., а стоимость одного карандаша равна ${pk} к. Какая сумма (в копейках) осталась у Толи, если всего у него было ${had / 100} р.?`,
      solution: `$3\\cdot${al}+${pc}\\cdot${pk}=${spent}$ к.; $${had}-${spent}=${ch}$ к.`,

      distractors: [`${ch + 30} к.`, `${ch - 6} к.`, `${ch + 15} к.`, `${ch + 45} к.`],

    });
  }

  if (skillId === 'arcsin-expression-value') {
    const vs = [
      { ang: 2, tex: '(-1)' },
      { ang: 6, tex: '\\left(-\\frac{1}{2}\\right)' },
      { ang: 4, tex: '\\left(-\\frac{\\sqrt{2}}{2}\\right)' },
      { ang: 3, tex: '\\left(-\\frac{\\sqrt{3}}{2}\\right)' }
    ];
    const v = pick(vs), q = randInt(3, 9), mult = v.ang * q, B = randInt(3, 9), ans = -q - B;
    return buildGeneratedQuestion({
      category: original.category, skillId,
      questionText: `Найдите значение выражения $\\frac{${mult}}{\\pi}\\cdot\\arcsin${v.tex}-|-${B}|$.`,

  if (skillId === 'expression-sense-at-negative') {
    const a = -randInt(5, 9), d = randInt(1, 9);
    const items = [
      { t: `$\\sqrt[${pick([3,5,7,9])}]{a}$`, ok: true },
      { t: `$\\sqrt[${pick([4,6,8])}]{a}$`, ok: false },
      { t: `$\\sqrt{a^${pick([2,4,6])}}$`, ok: true },
      { t: `$\\sqrt{a^${pick([3,5,7,9])}}$`, ok: false },
      { t: `$\\frac{1}{\\sqrt[${pick([3,5,7,9])}]{a-${d}}}$`, ok: true },
      { t: `$\\frac{1}{\\sqrt[${pick([4,6,8])}]{a-${d}}}$`, ok: false }
    ];
    shuffleArray(items);

    tk.forEach((i, idx) => { if (i.ok) ci.push(idx); });

      isGenerated: true, practiceOriginalId: original.id, isOriginal: false
    };
  }

  if (skillId === 'sum-multiples-in-interval') {
    const m = pick([9, 8, 7, 6, 11, 12]), st = randInt(2, 30);
    const lo = m * st - randInt(1, m - 1);
    const hi = m * (st + 2) + randInt(1, m - 1);
    const nums = [0, 1, 2].map(i => m * (st + i));

      id: `gen-${skillId}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`,

      options: [], correctAnswer: String(ans),
      solution: `Подходят ${nums.join(', ')}; сумма ${ans}.`,
      isGenerated: true, practiceOriginalId: original.id, isOriginal: false
    };
  }

  if (skillId === 'log-equation-product-times') {
    const k = pick([2, 3]);
    const [t1, t2] = pick([[1,2],[2,1],[1,3],[3,1],[2,3],[3,2]]);
    const d = t1 + t2, R = -t1 * t2;
    const u = k, v = k ** (t1 * t2 + 1);
    const K = pick([4, 11, 12, 15, 17]);
    const prod = k ** d;
    const ans = prod * K;
    return {
      id: `gen-${skillId}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`,
      category: original.category, skillId, sourceType: 'training-analog',
      type: 'input', maxPoints: 2,
      questionText: `Найдите произведение корней уравнения $\\log_${k}^2 x-${d}\\log_${k} x=\\log_${k} ${u}-\\log_${k} ${v}$. В ответ запишите найденное произведение, увеличенное в ${K} раз.`,
      options: [], correctAnswer: String(ans),
      solution: `Правая часть $=\\log_${k} ${u / v}=${R}$; $t^2-${d}t-${R}=0$, $t=${t1},${t2}$; произведение корней $x$ равно $${k}^{${d}}=${prod}$; умножаем на ${K}: ${ans}.`,
      isGenerated: true, practiceOriginalId: original.id, isOriginal: false
    };
  }

  if (skillId === 'exponential-inequality-smallest-integer') {
    const plus = Math.random() < 0.5;
    const p = plus ? pick([1, 3, 7, 8]) : pick([3, 7, 8]);
    const qm = plus ? pick([5, 9, 10, 25]) : pick([5, 9, 10]);
    const t = randInt(8, 20), A = 2 * t, B = 3 * t + 1;
    const coeff = 4 * p + (plus ? qm : -qm);
    let mm = randInt(1, 4);
    while ((mm + 2 * B) % 6 === 0) mm++;
    const C = coeff * (2 ** mm);
    const bound = (mm + 2 * B) / 6;

    return {
      id: `gen-${skillId}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`,
      category: original.category, skillId, sourceType: 'training-analog',
      type: 'input', maxPoints: 2,
      questionText: `Найдите наименьшее целое решение неравенства ${p === 1 ? '' : p + '\\cdot'}8^{2x-${A}}${plus ? '+' : '-'}${qm}\\cdot4^{3x-${B}}>${C}.`,
      options: [], correctAnswer: String(ans),
      solution: `При $u=2^{6x-${2 * B}}$: ${coeff}u>${C} → $u>2^{${mm}}$ → $x>${bound.toFixed(2)}$ → ${ans}.`,
      isGenerated: true, practiceOriginalId: original.id, isOriginal: false
    };
  }

  return null;
}

function questionSignature(q) {
  const opts = (q.options || []).slice().sort().join(' | ');
  let key = '';
  if (q.type === 'multi') key = (q.correctIndices || []).map(i => q.options[i]).slice().sort().join(' | ');
  else if (q.type === 'input') key = String(q.correctAnswer);
  else key = q.options && q.correctIndex !== undefined ? String(q.options[q.correctIndex]) : '';
  return `${q.questionText}||${opts}||${key}`;
}

function makeAnalog(original, usedSig) {
  const skill = original.skillId || original.category;
  if (!usedSig.has(skill)) {
    usedSig.set(skill, new Set(questions.filter(q => (q.skillId || q.category) === skill).map(q => questionSignature(q))));
  }
  const used = usedSig.get(skill);
  used.add(questionSignature(original));
  for (let i = 0; i < 80; i++) {
    const v = generateVariantForSkill(skill, original);
    if (v) {
      const sig = questionSignature(v);
      if (!used.has(sig)) { used.add(sig); return v; }
    }
  }
  return null;
}

function startErrorPractice(category, skillId = null) {
  clearScratchpadData();
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = null;
  timerEnabled = false;
  lastPracticeClosed = 0;
  const topic = category === undefined || category === null ? null : category;
  const ids = getErrors().filter(id => {
    const original = questions.find(q => String(q.id) === String(id));
    if (!original) return false;
    const topicMatches = Boolean(skillId) || !topic || getTopicForQuestion(original) === topic;
    const skillMatches = !skillId || String(original.skillId) === String(skillId);
    return topicMatches && skillMatches;
  });
  if (!ids.length) { alert('Для выбранной темы нет активных ошибок.'); return; }

  const pack = [];
  currentPracticeSession = { mistakes: {} };
  const usedSig = new Map();
  for (const eid of ids) {
    const original = questions.find(q => String(q.id) === String(eid));
    if (!original) continue;
    const key = String(original.id);
    currentPracticeSession.mistakes[key] = { originalCorrect: false, originalWrong: false, analogCorrect: 0, analogTotal: 0, analogPresented: 0 };
    pack.push(Object.assign({}, original, { practiceOriginalId: key, isOriginal: true }));
    let presented = 0;
    for (let i = 0; i < 3; i++) {
      const analog = makeAnalog(original, usedSig);
      if (analog) { pack.push(analog); presented++; }
    }
    currentPracticeSession.mistakes[key].analogPresented = presented;
  }
  if (!pack.length) { alert('Не удалось подготовить задания.'); currentPracticeSession = null; return; }

  shuffleArray(pack);
  currentTestQuestions = pack;
  currentQuestionIndex = 0;
  score = 0;
  sessionMaxPoints = 0;
  testMode = 'error';
  testKind = 'error';
  currentTestLabel = 'Отработка ошибок';
  answeredCurrent = false;
  multiSelection = new Set();
  currentScreen = 'test-screen';
  render();
}

function exitErrorPractice() {
  if (testMode !== 'error') { currentScreen = 'errors-menu'; render(); return; }
  const answered = currentQuestionIndex + (answeredCurrent ? 1 : 0);
  const msg = answered > 0
    ? 'Выйти из отработки?\n\nОшибки, по которым ты ответил на все задания (исходное и все аналоги), будут учтены. Остальные останутся без изменений.'
    : 'Выйти из отработки?\n\nТы ещё не ответил ни на один вопрос — список ошибок не изменится.';
  if (!confirm(msg)) return;
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  finishErrorPracticeSession(true);
  clearScratchpadData();
  answeredCurrent = false;
  multiSelection = new Set();
  currentScreen = 'errors-menu';
  render();
}

function afterAnswer(isCorrect, points, verdictText, verdictOk) {
  answeredCurrent = true;
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  score += points;
  const q = currentTestQuestions[currentQuestionIndex];
  sessionMaxPoints += q.maxPoints || 0;
  if (testKind === 'infinite') {
    infiniteAnsweredCount++;
    const answeredCounter = document.getElementById('infinite-answered-count');
    if (answeredCounter) answeredCounter.textContent = String(infiniteAnsweredCount);
  }

  if (testMode === 'normal' && !isCorrect) {
    const errors = getErrors();
    const id = String(q.id);
    if (!errors.includes(id)) { errors.push(id); saveErrors(errors); }
  }
  if (testMode === 'error' && q.practiceOriginalId && currentPracticeSession) {
    const record = currentPracticeSession.mistakes[String(q.practiceOriginalId)];
    if (record) {
      if (q.isOriginal) {
        if (isCorrect) record.originalCorrect = true;
        else record.originalWrong = true;
      } else {
        record.analogTotal++;
        if (isCorrect) record.analogCorrect++;
      }
    }
  }

  const verdict = document.getElementById('verdict-line');
  const solutionBlock = document.getElementById('solution-block');
  const nextButton = document.getElementById('next-btn');
  if (verdict) {
    verdict.textContent = verdictOk ? 'Корректно!' : 'Неверно!';
    verdict.classList.add('answer-feedback-verdict');
  }
  if (solutionBlock) {
    solutionBlock.classList.remove('answer-feedback-correct', 'answer-feedback-wrong');
    solutionBlock.classList.add(verdictOk ? 'answer-feedback-correct' : 'answer-feedback-wrong');
    if (q.type === 'single') solutionBlock.classList.add('hidden');
    else solutionBlock.classList.remove('hidden');
  }
  if (nextButton) nextButton.classList.remove('hidden');
}

function answerQuestion(idx) {
  if (answeredCurrent) return;
  const q = currentTestQuestions[currentQuestionIndex];
  const ok = idx === q.correctIndex;
  document.querySelectorAll('.option-btn').forEach((button, index) => {
    button.disabled = true;
    button.classList.remove('hover:border-indigo-300', 'hover:bg-indigo-50/40', 'bg-white', 'border-slate-200', 'text-slate-800', 'is-correct', 'is-wrong', 'is-missed', 'opacity-50', 'opacity-60');
    if (index === q.correctIndex) button.classList.add('is-correct', 'font-semibold');
    else if (index === idx && !ok) button.classList.add('is-wrong', 'font-semibold');
    else button.classList.add('opacity-60');
    const label = button.querySelector('.option-label');
    if (label) label.classList.remove('bg-slate-100', 'text-slate-500');
  });

  const chosenButton = document.querySelector(`.option-btn[data-idx="${idx}"]`);
  const optionText = chosenButton && chosenButton.querySelector('.option-text');
  if (optionText && !optionText.querySelector('.option-explanation')) {
    const correctAnswer = !ok
      ? `<p class="answer-correct-answer">Правильный ответ: ${formatQuestionText(q.options[q.correctIndex])}</p>`
      : '';
    optionText.insertAdjacentHTML('beforeend',
      `<div class="option-explanation"><p class="answer-feedback-verdict">${ok ? 'Корректно!' : 'Неверно!'}</p>${correctAnswer}<div class="answer-solution-copy">${getAnswerSolutionHtml(q)}</div></div>`);
    if (window.MathJax && window.MathJax.typesetPromise) {
      const explanation = optionText.querySelector('.option-explanation');
      if (explanation) window.MathJax.typesetPromise([explanation]).catch(() => {});
    }
  }

  afterAnswer(ok, ok ? 1 : 0, ok ? 'Корректно!' : 'Неверно!', ok);
}

function toggleMulti(idx) {
  if (answeredCurrent) return;
  const btn = document.querySelector(`.option-btn[data-idx="${idx}"]`);
  if (!btn) return;
  const lb = btn.querySelector('.option-label');
  if (multiSelection.has(idx)) {
    multiSelection.delete(idx);
    btn.classList.remove('border-indigo-500', 'bg-indigo-50');
    if (lb) { lb.classList.remove('bg-indigo-600', 'text-white'); lb.classList.add('bg-slate-100', 'text-slate-500'); }
  } else {
    multiSelection.add(idx);
    btn.classList.add('border-indigo-500', 'bg-indigo-50');
    if (lb) { lb.classList.add('bg-indigo-600', 'text-white'); lb.classList.remove('bg-slate-100', 'text-slate-500'); }
  }
}

function submitMulti() {
  if (answeredCurrent) return;
  const q = currentTestQuestions[currentQuestionIndex];
  const sel = [...multiSelection].sort((a, b) => a - b);
  const cor = [...q.correctIndices].sort((a, b) => a - b);
  const ok = sel.length === cor.length && sel.every((v, i) => v === cor[i]);
  const miss = q.correctIndices.filter(i => !multiSelection.has(i)).map(i => i + 1);
  const ext = [...multiSelection].filter(i => !q.correctIndices.includes(i)).map(i => i + 1);
  document.querySelectorAll('.option-btn').forEach((btn, idx) => {
    btn.disabled = true;
    btn.classList.remove('hover:border-indigo-300', 'hover:bg-indigo-50/40', 'bg-white', 'border-slate-200', 'text-slate-800', 'border-indigo-500', 'bg-indigo-50', 'is-correct', 'is-wrong', 'is-missed', 'opacity-60');
    const isC = q.correctIndices.includes(idx);
    const isS = multiSelection.has(idx);
    if (isS && isC) btn.classList.add('is-correct', 'font-semibold');
    else if (isS && !isC) btn.classList.add('is-wrong', 'font-semibold');
    else if (!isS && isC) {
      btn.classList.add('is-missed');
      const ot = btn.querySelector('.option-text');
      if (ot && !ot.querySelector('.missed-tag')) {
        ot.insertAdjacentHTML('beforeend', ' <span class="missed-tag text-[10px] font-bold uppercase tracking-wider text-amber-700">(верный, но не выбран)</span>');
      }
    } else btn.classList.add('opacity-60');
    const lb = btn.querySelector('.option-label');
    if (lb) lb.classList.remove('bg-slate-100', 'text-slate-500', 'bg-indigo-600', 'text-white');
  });
  const sb = document.getElementById('multi-submit');
  if (sb) sb.disabled = true;
  const verdict = ok
    ? 'Задание засчитано: 1 п.б. Выбраны все верные пункты и нет лишних.'
    : `Задание не засчитано: 0 п.б. Пропущены: ${miss.length ? miss.join(', ') : 'нет'}; лишние: ${ext.length ? ext.join(', ') : 'нет'}. В части A частично верные не засчитываются.`;
  afterAnswer(ok, ok ? 1 : 0, verdict, ok);
}

function submitInput() {
  if (answeredCurrent) return;
  const q = currentTestQuestions[currentQuestionIndex];
  const inp = document.getElementById('answer-input');
  if (!inp) return;
  const ok = inp.value === q.correctAnswer;
  inp.disabled = true;
  inp.classList.remove('border-slate-300');
  if (ok) inp.classList.add('border-emerald-500', 'bg-emerald-50', 'text-emerald-700');
  else inp.classList.add('border-rose-500', 'bg-rose-50', 'text-rose-800');
  const cb = document.getElementById('input-submit');
  if (cb) cb.disabled = true;
  const cl = document.getElementById('input-correct-line');
  if (!ok && cl) { cl.classList.remove('hidden'); cl.textContent = 'Правильный ответ: ' + q.correctAnswer; }
  afterAnswer(ok, ok ? 2 : 0, ok ? 'Задание засчитано: 2 п.б.' : 'Задание не засчитано: 0 п.б. Ответ части B засчитывается только при точном совпадении.', ok);
}

function finishErrorPracticeSession(onlyComplete) {
  if (!currentPracticeSession) return;
  let errs = getErrors();
  let removed = 0;
  for (const [key, rec] of Object.entries(currentPracticeSession.mistakes)) {
    if (onlyComplete) {
      const oa = rec.originalCorrect || rec.originalWrong;
      if (!(oa && rec.analogTotal >= (rec.analogPresented || 0))) continue;
    }
    const at = rec.analogTotal || 0;
    const success = !rec.originalWrong && rec.originalCorrect && at > 0 && rec.analogCorrect >= Math.min(2, at);
    if (success) {
      const before = errs.length;
      errs = errs.filter(id => String(id) !== String(key));
      if (errs.length < before) removed++;
    }
  }
  saveErrors(errs);
  lastPracticeClosed = removed;
  currentPracticeSession = null;
}

function nextQuestion() {
  if (testKind === 'infinite') {
    const next = getNextInfiniteQuestion();
    if (!next) { finishInfinitePractice(); return; }
    currentTestQuestions = [next];
    currentQuestionIndex = 0;
    answeredCurrent = false;
    multiSelection = new Set();
    render();
    return;
  }

  answeredCurrent = false;
  currentQuestionIndex++;
  multiSelection = new Set();
  if (currentQuestionIndex < currentTestQuestions.length) {
    render();
    if (timerEnabled && remainingSeconds > 0) startTimerInterval();
  } else {
    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
    if (testMode === 'error') finishErrorPracticeSession(false);
    clearScratchpadData();
    currentScreen = 'result-screen';
    render();
  }
}

function exportProgress() {
  const data = { schemaVersion: 3, historyPool: getHistoryPool(), errors: getErrors() };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'progress.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importProgress(ev) {
  const file = ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const parsed = JSON.parse(e.target.result);
      const src = parsed && typeof parsed === 'object' && parsed.state && typeof parsed.state === 'object' ? parsed.state : parsed;
      if (!src || typeof src !== 'object') throw new Error('Bad format');
      if (src.historyPool && Array.isArray(src.historyPool)) saveHistoryPool(src.historyPool);
      if (src.errors && Array.isArray(src.errors)) saveErrors(src.errors);
      alert('Прогресс успешно импортирован!');
      render();
    } catch (err) {
      alert('Ошибка при чтении файла! Убедитесь, что это корректный JSON прогресса.');
    }
  };
  reader.readAsText(file);
  ev.target.value = '';
}

  if (dialog) dialog.classList.remove('scratchpad-fullscreen');
  expand && expand.classList.remove('hidden');

    if (!scratchTextHeightCustom) scratchTextHeight = Math.max(360, Math.floor(window.innerHeight * .48));

  fullscreenText.style.fontSize = scratchTextFontSize + 'px';

  const start = normalText ? normalText.selectionStart : 0;
  const end = normalText ? normalText.selectionEnd : start;

function setScratchTextFontSize(delta) {

function placeScratchCaretAtBlankPoint(event) {
  const textarea = event.currentTarget;
  if (!textarea || event.button > 0) return;
  const rect = textarea.getBoundingClientRect();
  const style = window.getComputedStyle(textarea);
  const fontSize = parseFloat(style.fontSize) || scratchTextFontSize || 16;
  const lineHeight = parseFloat(style.lineHeight) || fontSize * 1.8;
  const paddingLeft = parseFloat(style.paddingLeft) || 0;
  const paddingTop = parseFloat(style.paddingTop) || 0;
  const probe = document.createElement('canvas');
  const context = probe.getContext('2d');
  if (context) context.font = style.font;
  const charWidth = (context && context.measureText('M').width) || fontSize * .6;
  const x = Math.max(0, event.clientX - rect.left - paddingLeft + textarea.scrollLeft);
  const y = Math.max(0, event.clientY - rect.top - paddingTop + textarea.scrollTop);
  const row = Math.max(0, Math.floor(y / lineHeight));
  const column = Math.max(0, Math.floor(x / charWidth));
  const lines = textarea.value.split('\n');
  const rowMissing = row >= lines.length;
  const line = rowMissing ? '' : lines[row];
  if (rowMissing || column > line.length) {
    while (lines.length <= row) lines.push('');
    if (lines[row].length < column) lines[row] += ' '.repeat(column - lines[row].length);
    textarea.value = lines.join('\n');
    let caret = 0;
    for (let i = 0; i < row; i++) caret += lines[i].length + 1;
    caret += Math.min(column, lines[row].length);

function insertScratchToken(token) {

function extendScratchCanvasForPoint(point) {

function handleScratchPointerMove(event) {

function renderScratchCanvas() {

      { title:'Параллельные прямые', tag:'Функции', topic:'Функции', body:`
        <p>У прямой вида <strong>$y=kx+b$</strong> коэффициент $k$ отвечает за наклон, а $b$ показывает, где прямая пересекает вертикальную ось $y$.</p>
        <p><strong>Чтобы две разные прямые были параллельны, нужны два условия:</strong></p>
        <div class="tip-rule-row"><span class="tip-rule-label">1. Одинаковый коэффициент наклона</span><span class="shrink-0">$k_1=k_2$</span></div>
        <div class="tip-rule-row"><span class="tip-rule-label">2. Разные свободные члены, иначе прямые совпадут</span><span class="shrink-0">$b_1≠b_2$</span></div>
        <p><strong>Пример:</strong> $y=3x+1$ и $y=3x-7$ параллельны, потому что коэффициент при $x$ у обеих равен $3$. Прямая $y=4x+1$ им не параллельна: её коэффициент равен $4$.</p>
      ` },
      { title:'Чётность функции за две проверки', tag:'Функции', topic:'Функции', body:`1) Проверь, симметрична ли область определения относительно нуля. 2) Сравни $f(-x)$ с $f(x)$ и $-f(x)$. Если первое равно — функция чётная; если второе — нечётная. Пример: $f(x)=x^2$ чётная, $g(x)=x^3$ нечётная. Функция $x^2+x$ обычно не является ни той, ни другой.` },
      { title:'Сумма и разность логарифмов', tag:'Логарифмы', topic:'Логарифмы', body:`При одинаковом основании сумма превращается в логарифм произведения, а разность — в логарифм частного: $\\log_a b+\\log_a c=\\log_a(bc),$ $\\log_a b-\\log_a c=\\log_a\\frac bc.$ Например, $\\log_2 5+\\log_2 9=\\log_2 45$ — не $\\log_2 14$ и не произведение двух логарифмов.` },
      { title:'Почему синус равен нулю при x = −π', tag:'Тригонометрия', topic:'Тригонометрия', body:`Запомни: ось x — горизонтальная, ось y — вертикальная. На единичной окружности косинус — координата по x, а синус — координата по y.
        <div class="unit-circle-demo">
          <svg viewBox="0 0 260 180" role="img" aria-label="Единичная окружность: ось x горизонтальная, ось y вертикальная, точка с координатами минус один ноль">
            <line x1="18" y1="84" x2="242" y2="84" stroke="#2563eb" stroke-width="1.8"/>
            <line x1="130" y1="12" x2="130" y2="158" stroke="#2563eb" stroke-width="1.8"/>
            <circle cx="130" cy="84" r="55" fill="#fff" stroke="#64748b" stroke-width="2"/>
            <circle cx="75" cy="84" r="5" fill="#dc2626" stroke="#fff" stroke-width="1.5"/>
            <text x="228" y="75" fill="#1d4ed8" font-size="12" font-weight="700">x</text>
            <text x="138" y="19" fill="#1d4ed8" font-size="12" font-weight="700">y</text>
            <text x="33" y="107" fill="#991b1b" font-size="12" font-weight="700">(-1; 0)</text>
            <text x="136" y="101" fill="#475569" font-size="11">0</text>
          </svg>
          <div class="unit-circle-axis-note"><span>Ось x — горизонтальная</span><span>Ось y — вертикальная</span></div>
        </div>
        При $x=-\\pi$ точка находится в координатах $(-1,0)$: вертикальная координата равна нулю, поэтому $\\sin(-\\pi)=0$, но $\\cos(-\\pi)=-1$. В общем виде: $\\sin x=0$ при $x=\\pi k$. Для косинуса наоборот: $\\cos x=0$ при $x=\\frac\\pi2+\\pi k$.` },
      { title:'Треугольники: три быстрых факта', tag:'Геометрия', topic:'Геометрия', body:`<p>Обозначения: $P$ — периметр (сумма длин всех сторон); $S$ — площадь; $h$ — высота; $a$ — сторона; $b$ — основание; $c$ — гипотенуза; $m$ — медиана. В задачах о конусе обычно $l$ или $L$ обозначает образующую.</p><div class="tip-geometry-legend"><span><strong>Равносторонний треугольник:</strong> $a=P/3$, где $a$ — сторона.</span><span><strong>Равнобедренный треугольник:</strong> если основание равно $b$, то боковая сторона $a=(P-b)/2$.</span><span><strong>Прямоугольный треугольник:</strong> медиана к гипотенузе $m=c/2$.</span></div><p>Эти формулы помогают быстро проверять утверждения без полного решения.</p>` },
      { title:'Максимум одинаковых наборов', tag:'Делимость', topic:'Числа и делимость', body:`Если нужно разложить несколько количеств по одинаковым наборам без остатка, ищи НОД. Например, из $24$, $36$ и $60$ предметов можно сделать максимум $\\operatorname{НОД}(24,36,60)=12$ одинаковых наборов.` },
      { title:'Деление с остатком', tag:'Числа', topic:'Числа и делимость', body:`<p>Главное правило: делимое — число, которое делим.</p><div class="tip-plain-formula"><span><strong>Делимое</strong> =</span><span><strong>делитель</strong> × <strong>неполное частное</strong></span><span>+</span><span class="formula-term"><strong>остаток</strong></span></div><p><strong>Пример:</strong> делитель — $7$, неполное частное — $12$, остаток — $3$. Тогда делимое: $7\\cdot12+3=87$.</p><p>Остаток всегда неотрицательный и строго меньше делителя: при делении на $7$ остаток может быть от $0$ до $6$.</p>` },
      { title:'Чётный и нечётный корень', tag:'Корни', topic:'Корни', body:`Корень чётной степени из отрицательного числа не является действительным: $\\sqrt{-9}$ не имеет действительного значения. Корень нечётной степени определён и для отрицательных чисел: $\\sqrt[3]{-8}=-2$. Если корень стоит в знаменателе, знаменатель дополнительно не должен обращаться в ноль.` },
      { title:'Признак делимости на 9', tag:'Числа', topic:'Числа и делимость', body:`Число делится на $9$ без остатка, если сумма его цифр делится на $9$. <p><strong>Пример:</strong> для числа $4635$ сумма цифр равна $4+6+3+5=18$. Число $18$ делится на $9$, значит, $4635$ тоже делится на $9$.</p><p>Если сумма цифр не делится на $9$, само число тоже не делится на $9$.</p>` },

    app.innerHTML = `

        <div class="flex justify-end">
          <button onclick="openScratchpad()" class="inline-flex items-center gap-2 rounded-xl border border-indigo-200 bg-indigo-50 px-4 py-2.5 text-sm font-bold text-indigo-800 shadow-sm hover:bg-indigo-100">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="h-5 w-5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="m14 5 5 5M4 20l4.5-1 10-10a2.1 2.1 0 0 0-3-3l-10 10L4 20z"/></svg>
            Черновик
          </button>
        </div>
        ${testMode === 'error' ? `<button onclick="exitErrorPractice()" class="w-full sm:w-auto text-slate-600 hover:text-slate-900 font-semibold text-sm flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-slate-100">${BACK_BTN}<span>Выйти из отработки</span></button>` : testKind === 'infinite' ? `<button onclick="finishInfinitePractice()" class="w-full sm:w-auto text-slate-600 hover:text-slate-900 font-semibold text-sm flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-slate-100"><span>Завершить практику</span><span class="text-xs text-slate-500">(<span id="infinite-answered-count">${infiniteAnsweredCount}</span> отвечено)</span></button>` : ''}
        <div class="space-y-2">
          <div class="flex justify-between text-xs font-semibold text-slate-500 items-center">
            ${testKind === 'infinite' ? `<span>Вопрос ${infiniteAnsweredCount + 1} · бесконечная практика</span>` : `<span>Вопрос ${currentQuestionIndex + 1} из ${currentTestQuestions.length}</span>`}
            <div class="flex items-center space-x-3">
              ${timerEnabled ? `<span id="timer-display" class="bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded font-mono font-bold">--:--</span>` : ''}
              <span class="bg-slate-100 px-2 py-0.5 rounded text-slate-700">${escapeHtml(q.category)}</span>
            </div>
          </div>
          ${testKind !== 'infinite' ? `<div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden"><div class="bg-indigo-600 h-full transition-all duration-300" style="width:${pp}%"></div></div>` : ''}
        </div>
        ${q.year ? `<p class="text-[11px] font-bold uppercase tracking-wider text-indigo-500">${escapeHtml(sourceLabel(q))}</p>` : ''}
        <div class="math-question font-semibold text-slate-900 bg-indigo-50/50 border border-indigo-100 rounded-xl p-4 sm:p-5">${formatQuestionText(q.questionText)}</div>
        <div class="space-y-3">${area}</div>
        <div id="solution-block" class="hidden answer-feedback">
          <p id="verdict-line" class="answer-feedback-verdict"></p>
          <div class="solution-copy answer-solution-copy">${getAnswerSolutionHtml(q)}</div>
        </div>
        <button id="next-btn" onclick="nextQuestion()" class="hidden w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3.5 px-6 rounded-xl shadow-md">Дальше</button>
      </div>`;
    if (timerEnabled) updateTimerUI();
  }

  else if (currentScreen === 'result-screen') {
    if (timerInterval) clearInterval(timerInterval);
    const maxPts = sessionMaxPoints;
    const pct = maxPts ? Math.round((score / maxPts) * 100) : 0;
    const tb = testKind === 'infinite-finished' ? null : primaryToTest(score);
    const mk = tb === null ? null : testToMark(tb);
    let msg = 'Отличный результат!';
    if (pct < 50) msg = 'Стоит еще повторить теорию по этой теме.';
    else if (pct < 80) msg = 'Хороший результат, но есть над чем поработать!';
    const ae = getErrors().length;
    app.innerHTML = `
      <div class="space-y-6 text-center py-4">
        <div class="space-y-2">
          <h2 class="text-2xl sm:text-3xl font-bold text-slate-900">Тест завершен!</h2>
          <p class="text-slate-600 text-sm">${msg}</p>
          <p class="text-slate-500 text-xs">Режим: ${escapeHtml(currentTestLabel || 'Тест')}</p>
          ${testMode === 'error' ? `<p class="text-slate-500 text-xs">Закрыто ошибок за сессию: ${lastPracticeClosed}. Активных ошибок осталось: ${ae}.</p>` : ''}
        </div>
        <div class="bg-slate-50 border border-slate-200 rounded-2xl p-6 max-w-xs mx-auto space-y-2">
          <p class="text-xs font-semibold text-slate-500 uppercase">Первичный балл</p>
          <div class="text-4xl font-bold text-indigo-600">${score} / ${maxPts} п.б.</div>
          <div class="text-lg font-semibold text-slate-700">${pct}% первичных баллов</div>
${tb !== null ? `<div class="text-sm text-slate-600">По таблице перевода: <span class="font-bold text-slate-800">${tb}</span> тестовых баллов</div><div class="text-sm text-slate-600">Отметка в аттестат: <span class="font-bold text-slate-800">${mk}</span></div>` : `<div class="text-sm text-slate-600">Решено заданий: <span class="font-bold text-slate-800">${infiniteAnsweredCount}</span></div>`}
        </div>
${tb !== null ? `<p class="text-xs text-slate-500 max-w-sm mx-auto">Таблицы перевода действуют для полного варианта (50 п.б. и 100 тестовых). В тренажёре вариант короче, поэтому тестовый балл и отметка показаны справочно.</p>` : `<p class="text-xs text-slate-500 max-w-sm mx-auto">Для бесконечной практики показан результат этой сессии без пересчёта в экзаменационную отметку.</p>`}
        <button onclick="currentScreen='main-menu';render();" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-4 px-6 rounded-xl shadow-md">В главное меню</button>
      </div>`;
  }

  requestAnimationFrame(typesetMath);
}

window.addEventListener('load', typesetMath);
render();
</script>
</body>
</html>
